<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💙</title>

<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(to bottom, #9ecbff, #d6ecff);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
  }

  .gif-box {
    width: 260px;
    height: 260px;
    margin-bottom: 15px;
  }

  .gif-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  h1 {
    font-size: 2.6em;
    color: #003366;
    margin-bottom: 20px;
  }

  .buttons {
    display: flex;
    gap: 20px;
  }

  button {
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: white;
    transition: all 0.3s ease;
  }

  #yesBtn {
    background-color: #1e90ff;
    font-size: 26px;
    padding: 18px 36px;
  }

  #noBtn {
    background-color: #0059b3;
    font-size: 26px;
    padding: 18px 36px;
  }
</style>
</head>

<body>

<div class="gif-box">
  <img id="gif" src="https://media.tenor.com/JIX9t2j0ZTNAAAAC/cat-cute.gif" alt="cute cat gif">
</div>

<h1 id="question">Will you be my Valentine? 💙</h1>

<div class="buttons">
  <button id="yesBtn">Yes 💌</button>
  <button id="noBtn">No 😢</button>
</div>

<script>
const question = document.getElementById("question");
const gif = document.getElementById("gif");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

let step = 0;

const questions = [
  "Are you sure? I’m literally adorable 🥺",
  "This cat is judging you right now",
  "Okay but… imagine the vibes?",
  "The cat is begging now 😭",
  "You’re breaking tiny imaginary hearts",
  "Saying yes costs nothing btw",
  "The cat will remember this",
  "We could be cute AND iconic",
  "This is emotional damage",
  "Please. I am on my knees."
];

const gifs = [
  "https://media.tenor.com/JIX9t2j0ZTNAAAAC/cat-cute.gif",
  "https://media.tenor.com/mlvseq9yvZhAAAAC/cat-sad.gif",
  "https://media.tenor.com/3oriO0OEd9QIDdllqoAAAAC/cat-stare.gif",
  "https://media.tenor.com/13borq7Zo2kulOAAAAC/cat-beg.gif",
  "https://media.tenor.com/VbnUQpnihPSIgAAAAC/cat-cry.gif",
  "https://media.tenor.com/MDJ9IbxxvDUQAAAAC/cat-please.gif",
  "https://media.tenor.com/l4KibK3JwaVoAAAAC/cat-disappointed.gif",
  "https://media.tenor.com/5i7umUqAOYYEwAAAAC/cat-love.gif",
  "https://media.tenor.com/ICOgUNjpvO0PCAAAAC/cat-dramatic.gif",
  "https://media.tenor.com/12HZukMBlutpoQAAAAC/cat-begging.gif"
];

let yesFont = 26, yesPad = 18;
let noFont = 26, noPad = 18;

noBtn.addEventListener("click", () => {
  if (step < questions.length) {
    question.textContent = questions[step];
    gif.src = gifs[step];

    noFont = Math.max(10, noFont - 3);
    noPad = Math.max(6, noPad - 2);
    yesFont += 4;
    yesPad += 3;

    noBtn.style.fontSize = noFont + "px";
    noBtn.style.padding = `${noPad}px ${noPad * 2}px`;

    yesBtn.style.fontSize = yesFont + "px";
    yesBtn.style.padding = `${yesPad}px ${yesPad * 2}px`;

    step++;
  }
});

yesBtn.addEventListener("click", () => {
  gif.src = "https://media.tenor.com/l0MYC0LajbaPoEADuAAAAC/cat-happy.gif";
  question.textContent = "YAY 💙 YOU SAID YES 💌";
  yesBtn.style.display = "none";
  noBtn.style.display = "none";
});
</script>

</body>
</html>
