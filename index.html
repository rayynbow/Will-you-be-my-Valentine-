<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>
<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(to bottom, #a0c4ff, #d0e7ff);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
    animation: pulse 4s infinite alternate;
  }

  @keyframes pulse {
    0% {background: linear-gradient(to bottom, #a0c4ff, #d0e7ff);}
    100% {background: linear-gradient(to bottom, #74b9ff, #a8e0ff);}
  }

  h1 {
    font-size: 3em;
    color: #003366;
    margin-bottom: 1em;
    transition: all 0.3s;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
  }

  button {
    padding: 15px 30px;
    font-size: 1.5em;
    margin: 10px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: white;
    transition: all 0.3s;
    position: relative;
  }

  button:hover {
    transform: rotate(-5deg) scale(1.1);
  }

  #yesBtn {
    background-color: #1e90ff;
    box-shadow: 0 5px 15px rgba(30,144,255,0.4);
  }

  #noBtn {
    background-color: #0059b3;
    box-shadow: 0 5px 15px rgba(0,89,179,0.4);
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<!-- Deploy trigger ✔ -->
<h1 id="question">Will you be my Valentine? 💙</h1>
<div>
  <button id="yesBtn">Yes 💌</button>
  <button id="noBtn">No 😢</button>
</div>

<canvas id="fireworks"></canvas>

<script>
const question = document.getElementById('question');
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let noClicks = 0;
const noBaseSize = 150; // fixed starting size for No button

// Persuasive messages
const messages = [
  "Are you sure? I promise I'm extra sweet! 🍬",
  "No? But Otto says you should!",
  "Come on, don't be shy! You know you want to 💕",
  "You know saying yes makes your day 1000% better! 😍",
  "But BABBBEEEEEEEEEEEE",
  "I think we're a perfect match! 🌟"
];

// Funny cat GIFs
const catGIFs = [
  "https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif",
  "https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif",
  "https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif",
  "https://media.giphy.com/media/13borq7Zo2kulO/giphy.gif"
];

function showCatGIF() {
  const gif = document.createElement('img');
  gif.src = catGIFs[Math.floor(Math.random() * catGIFs.length)];
  gif.style.position = 'fixed';
  gif.style.left = Math.random() * (window.innerWidth - 150) + 'px';
  gif.style.top = Math.random() * (window.innerHeight - 150) + 'px';
  gif.style.width = '100px';
  gif.style.height = '100px';
  gif.style.pointerEvents = 'none';
  gif.style.transition = 'transform 3s ease, opacity 3s ease';
  document.body.appendChild(gif);

  setTimeout(() => {
    gif.style.transform = `translateY(-100px)`;
    gif.style.opacity = 0;
  }, 50);

  setTimeout(() => {
    gif.remove();
  }, 3000);
}

// No button click
noBtn.addEventListener('click', () => {
  noClicks++;

  // Always shrink No button
  let noSize = Math.max(50, noBaseSize - noClicks * 20);
  noBtn.style.fontSize = noSize / 10 + 'em';
  noBtn.style.padding = noSize / 5 + 'px ' + noSize / 10 + 'px';

  // Yes button grows
  let yesSize = 150 + noClicks * 20;
  yesBtn.style.fontSize = yesSize / 50 + 'em';
  yesBtn.style.padding = yesSize / 10 + 'px ' + yesSize / 20 + 'px';

  // Update question
  if (noClicks <= messages.length) {
    question.textContent = messages[noClicks - 1];
  } else {
    question.textContent = "Pretty please? 😇";
  }

  // Show a funny cat GIF
  showCatGIF();
});

// Yes button click
yesBtn.addEventListener('click', () => {
  question.textContent = "YAY! 💙 You said YES! 💌";
  yesBtn.style.display = 'none';
  noBtn.style.display = 'none';
  startFireworks();
});

// Fireworks
let fireworksArr = [];

function drawHeart(x, y, size, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(size/2, -size/2, size, size/3, 0, size);
  ctx.bezierCurveTo(-size, size/3, -size/2, -size/2, 0, 0);
  ctx.fill();
  ctx.restore();
}

function startFireworks() {
  setInterval(() => {
    createFirework(Math.random() * canvas.width, Math.random() * canvas.height/2);
  }, 300);
  requestAnimationFrame(animateFireworks);
}

function createFirework(x, y) {
  for (let i=0; i<30; i++) {
    fireworksArr.push({
      x: x,
      y: y,
      dx: (Math.random() - 0.5) * 6,
      dy: (Math.random() - 0.5) * 6,
      alpha: 1,
      color: `hsl(${Math.random()*360}, 100%, 50%)`,
      size: 5 + Math.random()*5
    });
  }
}

function animateFireworks() {
  ctx.clearRect(0,0,canvas.width, canvas.height);
  fireworksArr.forEach((f, i) => {
    drawHeart(f.x, f.y, f.size, f.color);
    f.x += f.dx;
    f.y += f.dy;
    f.alpha -= 0.02;
    if(f.alpha <= 0) fireworksArr.splice(i, 1);
  });
  requestAnimationFrame(animateFireworks);
}

// Floating hearts and cats in background
function createFloatingGraphic() {
  const graphic = document.createElement('div');
  const emoji = Math.random() > 0.5 ? '💙' : '🐱';
  graphic.textContent = emoji;
  graphic.style.position = 'fixed';
  graphic.style.left = Math.random() * window.innerWidth + 'px';
  graphic.style.top = window.innerHeight + 'px';
  graphic.style.fontSize = (15 + Math.random()*25) + 'px';
  graphic.style.opacity = Math.random();
  graphic.style.pointerEvents = 'none';
  graphic.style.transition = 'transform 6s linear';
  document.body.appendChild(graphic);
  setTimeout(() => {
    graphic.style.transform = `translateY(-${window.innerHeight + 50}px)`;
  }, 10);
  setTimeout(() => {
    graphic.remove();
  }, 6000);
}

setInterval(createFloatingGraphic, 500);

</script>
</body>
</html>
