<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine? 💙</title>
<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(to bottom, #9ecbff, #d6ecff);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
  }

  .image-box {
    width: 260px;
    height: 260px;
    margin-bottom: 20px;
  }

  .image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 20px;
  }

  h1 {
    font-size: 2.6em;
    color: #003366;
    margin-bottom: 20px;
  }

  .buttons {
    display: flex;
    gap: 20px;
  }

  button {
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: white;
    transition: all 0.3s ease;
  }

  #yesBtn {
    background-color: #1e90ff;
    font-size: 26px;
    padding: 18px 36px;
  }

  #noBtn {
    background-color: #0059b3;
    font-size: 26px;
    padding: 18px 36px;
  }
</style>
</head>
<body>

<div class="image-box">
  <img id="catImg" src="images/cat1.jpg" alt="cute cat">
</div>

<h1 id="question">Will you be my Valentine? 💙</h1>

<div class="buttons">
  <button id="yesBtn">Yes 💌</button>
  <button id="noBtn">No 😢</button>
</div>

<script>
const question = document.getElementById("question");
const catImg = document.getElementById("catImg");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

let step = 0;

  
// Persuasive questions
const questions = [
  "Are you sure? I asked nicely 🥺",
  "This cat thinks you should reconsider",
  "Okay but imagine how cute we'd be",
  "The cat is disappointed now",
  "That hurt a little, not gonna lie",
  "Saying yes is literally free",
  "This cat believes in us",
  "We could be iconic together",
  "The cat has emotional damage",
  "Last chance… the cat is begging"
];

// Use your images folder — make sure the paths match your repo
const images = [
  "images/cat1.jpg",
  "images/cat2.jpg",
  "images/cat3.jpg",
  "images/cat4.jpg",
  "images/cat5.jpg",
  "images/cat6.jpg",
  "images/cat7.jpg",
  "images/cat8.jpg",
  "images/cat9.jpg",
  "images/cat10.jpg"
];

let yesFont = 26;
let yesPad = 18;
let noFont = 26;
let noPad = 18;

noBtn.addEventListener("click", () => {
  if (step < questions.length) {
    question.textContent = questions[step];
    catImg.src = images[step];

    // NO button ALWAYS shrinks
    noFont = Math.max(10, noFont - 3);
    noPad = Math.max(6, noPad - 2);

    // YES button ALWAYS grows
    yesFont += 4;
    yesPad += 3;

    noBtn.style.fontSize = noFont + "px";
    noBtn.style.padding = `${noPad}px ${noPad * 2}px`;

    yesBtn.style.fontSize = yesFont + "px";
    yesBtn.style.padding = `${yesPad}px ${yesPad * 2}px`;

    step++;
  }
});

yesBtn.addEventListener("click", () => {
  question.textContent = "YAY 💙 YOU SAID YES 💌";
  catImg.src = "images/cat5.jpg"; // special ending image
  yesBtn.style.display = "none";
  noBtn.style.display = "none";
});
</script>

</body>
</html>
