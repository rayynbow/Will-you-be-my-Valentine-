<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Will You Be My Valentine?</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(180deg, #8ec5ff, #cfe9ff);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    text-align: center;
  }

  .container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
  }

  h1 {
    font-size: clamp(1.8rem, 6vw, 2.5rem);
    color: #003366;
    margin-bottom: 24px;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }

  button {
    width: 80%;
    padding: 16px;
    font-size: 1.2rem;
    border-radius: 14px;
    border: none;
    color: white;
    cursor: pointer;
    transition: transform 0.25s ease;
    touch-action: manipulation;
  }

  #yesBtn { background: #1e90ff; }
  #noBtn  { background: #0059b3; }

  canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  .float {
    position: fixed;
    bottom: -40px;
    font-size: 24px;
    animation: floatUp 6s linear forwards;
    pointer-events: none;
  }

  @keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to   { transform: translateY(-110vh); opacity: 0; }
  }
</style>
</head>

<body>
<div class="container">
  <h1 id="question">Will you be my Valentine? 💙</h1>

  <div class="buttons">
    <button id="yesBtn">Yes 💌</button>
    <button id="noBtn">No 😢</button>
  </div>
</div>

<canvas id="fireworks"></canvas>

<script>
const question = document.getElementById("question");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let noClicks = 0;
let noScale = 1;
let yesScale = 1;

const messages = [
  "Are you sure? 💙",
  "Otto says yes 🐱",
  "Come onnn 🥺",
  "This is getting unfair 😭",
  "You KNOW you want to 😏"
];

// NO button — always shrinks
noBtn.addEventListener("click", () => {
  noClicks++;

  noScale = Math.max(0.4, noScale - 0.12);
  yesScale += 0.12;

  noBtn.style.transform = `scale(${noScale})`;
  yesBtn.style.transform = `scale(${yesScale})`;

  question.textContent = messages[noClicks - 1] || "Pretty please? 💙";
});

// YES button
yesBtn.addEventListener("click", () => {
  question.textContent = "YAY 💙 YOU SAID YES 💌";
  yesBtn.remove();
  noBtn.remove();
  startHeartFireworks();
});

// 💖 HEART FIREWORKS (mobile safe)
let hearts = [];

function startHeartFireworks() {
  setInterval(() => {
    hearts.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height * 0.4,
      size: 8 + Math.random() * 8,
      alpha: 1,
      dy: -1 - Math.random() * 2
    });
  }, 250);

  requestAnimationFrame(drawHearts);
}

function drawHeart(x, y, size, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size, size);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#ff4d6d";

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-1, -1, -2.5, 1, 0, 3);
  ctx.bezierCurveTo(2.5, 1, 1, -1, 0, 0);
  ctx.fill();

  ctx.restore();
}

function drawHearts() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  hearts.forEach((h, i) => {
    drawHeart(h.x, h.y, h.size / 10, h.alpha);
    h.y += h.dy;
    h.alpha -= 0.02;

    if (h.alpha <= 0) hearts.splice(i, 1);
  });

  requestAnimationFrame(drawHearts);
}

// Floating cats & hearts
function spawnFloat() {
  const el = document.createElement("div");
  el.className = "float";
  el.textContent = Math.random() > 0.5 ? "🐱" : "💙";
  el.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

setInterval(spawnFloat, 900);

// Resize support
window.addEventListener("resize", () => {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
});
</script>
</body>
</html>
