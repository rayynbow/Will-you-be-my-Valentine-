<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>

<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(to bottom, #9ecbff, #d6ecff);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
  }

  img {
    width: 220px;
    height: auto;
    margin-bottom: 15px;
  }

  h1 {
    font-size: 2.8em;
    color: #003366;
    margin-bottom: 20px;
  }

  .buttons {
    display: flex;
    gap: 20px;
  }

  button {
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: white;
    transition: all 0.3s ease;
  }

  /* EXPLICIT STARTING SIZES (IMPORTANT) */
  #yesBtn {
    background-color: #1e90ff;
    font-size: 26px;
    padding: 18px 36px;
  }

  #noBtn {
    background-color: #0059b3;
    font-size: 26px;
    padding: 18px 36px;
  }
</style>
</head>

<body>
<!-- Deploy trigger ✔ -->

<img id="gif" src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif">

<h1 id="question">Will you be my Valentine? 💙</h1>

<div class="buttons">
  <button id="yesBtn">Yes 💌</button>
  <button id="noBtn">No 😢</button>
</div>

<script>
const question = document.getElementById("question");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const gif = document.getElementById("gif");

let step = 0;

/* Questions */
const questions = [
  "Are you sure? I’m actually very cute 🥺",
  "What if I promise snacks and hugs?",
  "Otto thinks you should reconsider 🐱",
  "This is getting suspicious… destiny maybe?",
  "Saying yes unlocks premium happiness 💙",
  "I am literally asking so nicely right now",
  "At this point the cat will be disappointed",
  "Okay but imagine how cute we’d be",
  "Last chance before I dramatically gasp 😮",
  "Okay fine… but please say yes 😭"
];

/* Cat GIFs (one per question) */
const gifs = [
  "https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif",
  "https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif",
  "https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif",
  "https://media.giphy.com/media/13borq7Zo2kulO/giphy.gif",
  "https://media.giphy.com/media/VbnUQpnihPSIgIXuZv/giphy.gif",
  "https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif",
  "https://media.giphy.com/media/l4KibK3JwaVo0CjDO/giphy.gif",
  "https://media.giphy.com/media/5i7umUqAOYYEw/giphy.gif",
  "https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif",
  "https://media.giphy.com/media/12HZukMBlutpoQ/giphy.gif"
];

/* Button sizes (LOCKED) */
let yesFont = 26;
let yesPad = 18;
let noFont = 26;
let noPad = 18;

/* NO CLICK */
noBtn.addEventListener("click", () => {
  if (step < questions.length) {
    question.textContent = questions[step];
    gif.src = gifs[step];

    /* Size changes AFTER question change */
    noFont = Math.max(10, noFont - 3);
    noPad = Math.max(6, noPad - 2);

    yesFont += 4;
    yesPad += 3;

    noBtn.style.fontSize = noFont + "px";
    noBtn.style.padding = noPad + "px " + (noPad * 2) + "px";

    yesBtn.style.fontSize = yesFont + "px";
    yesBtn.style.padding = yesPad + "px " + (yesPad * 2) + "px";

    step++;
  }
});

/* YES CLICK */
yesBtn.addEventListener("click", () => {
  gif.src = "https://media.giphy.com/media/l0MYC0LajbaPoEADu/giphy.gif";
  question.textContent = "YAY 💙 YOU SAID YES 💌";
  yesBtn.style.display = "none";
  noBtn.style.display = "none";
});
</script>

</body>
</html>
