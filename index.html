<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Will You Be My Valentine?</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(180deg, #8ec5ff, #cfe9ff);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
  }

  .container {
    padding: 20px;
    width: 100%;
    max-width: 420px;
  }

  h1 {
    font-size: clamp(1.8rem, 6vw, 2.5rem);
    color: #003366;
    margin-bottom: 24px;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }

  button {
    width: 80%;
    padding: 16px;
    font-size: 1.2rem;
    border-radius: 14px;
    border: none;
    color: white;
    cursor: pointer;
    transition: transform 0.25s ease;
    touch-action: manipulation;
  }

  #yesBtn {
    background: #1e90ff;
  }

  #noBtn {
    background: #0059b3;
  }

  canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  .float {
    position: fixed;
    bottom: -40px;
    font-size: 24px;
    animation: floatUp 6s linear forwards;
    pointer-events: none;
  }

  @keyframes floatUp {
    from {
      transform: translateY(0);
      opacity: 1;
    }
    to {
      transform: translateY(-110vh);
      opacity: 0;
    }
  }
</style>
</head>

<body>
<div class="container">
  <h1 id="question">Will you be my Valentine? 💙</h1>

  <div class="buttons">
    <button id="yesBtn">Yes 💌</button>
    <button id="noBtn">No 😢</button>
  </div>
</div>

<canvas id="fireworks"></canvas>

<script>
const question = document.getElementById("question");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let noClicks = 0;
let noScale = 1;
let yesScale = 1;

const messages = [
  "But Babbbbeeeeeeee 💙",
  "Even Otto wants you to say yes! 🐱",
  "Come onnn 🥺",
  "This is getting unfair 😭",
  "You KNOW you want to 😏"
];

// NO button logic (ALWAYS SHRINKS)
noBtn.addEventListener("click", () => {
  noClicks++;

  noScale = Math.max(0.4, noScale - 0.12);
  yesScale += 0.12;

  noBtn.style.transform = `scale(${noScale})`;
  yesBtn.style.transform = `scale(${yesScale})`;

  question.textContent = messages[noClicks - 1] || "Pretty please? 💙";
});

// YES button logic
yesBtn.addEventListener("click", () => {
  question.textContent = "YAY 💙 YOU SAID YES 💌";
  yesBtn.remove();
  noBtn.remove();
  startFireworks();
});

// FIREWORKS (lightweight)
let sparks = [];

function startFireworks() {
  setInterval(() => {
    sparks.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height * 0.4,
      r: 0,
      a: 1
    });
  }, 700);

  requestAnimationFrame(drawFireworks);
}

function drawFireworks() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  sparks.forEach((s, i) => {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = "#4da6ff";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();

    s.r += 2;
    s.a -= 0.03;

    if (s.a <= 0) sparks.splice(i, 1);
  });

  requestAnimationFrame(drawFireworks);
}

// FLOATING CATS & HEARTS
function spawnFloat() {
  const el = document.createElement("div");
  el.className = "float";
  el.textContent = Math.random() > 0.5 ? "🐱" : "💙";
  el.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(el);

  setTimeout(() => el.remove(), 6000);
}

setInterval(spawnFloat, 900);

// Resize handling
window.addEventListener("resize", () => {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
});
</script>
</body>
</html>
