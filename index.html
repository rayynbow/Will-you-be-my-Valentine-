<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>
<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(to bottom, #ffb3c6, #ffe6f0);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
  }

  h1 {
    font-size: 3em;
    color: #d10068;
    margin-bottom: 1em;
    transition: all 0.3s;
  }

  button {
    padding: 15px 30px;
    font-size: 1.5em;
    margin: 10px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: white;
    transition: all 0.3s;
    position: relative;
  }

  #yesBtn {
    background-color: #ff4da6;
  }

  #noBtn {
    background-color: #900048;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<h1 id="question">Will you be my Valentine? 💖</h1>
<div>
  <button id="yesBtn">Yes 💌</button>
  <button id="noBtn">No 😢</button>
</div>

<canvas id="fireworks"></canvas>

<script>
const question = document.getElementById('question');
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let noClicks = 0;

// Array of persuasive messages
const messages = [
  "Are you sure? I promise I'm extra sweet! 🍬",
  "No? But Otto says you should!",
  "Come on, don't be shy! 💕",
  "You know saying yes makes your day 1000% better! 😍",
  "I think we're a perfect match! 🌟"
];

// When No is clicked
noBtn.addEventListener('click', () => {
  noClicks++;
  
  // Shrink No button
  let noSize = Math.max(50, 150 - noClicks*20);
  noBtn.style.fontSize = noSize/10 + 'em';
  noBtn.style.padding = noSize/5 + 'px ' + noSize/10 + 'px';
  
  // Grow Yes button
  let yesSize = 150 + noClicks*20;
  yesBtn.style.fontSize = yesSize/50 + 'em';
  yesBtn.style.padding = yesSize/10 + 'px ' + yesSize/20 + 'px';

  // Change question to next message
  if (noClicks <= messages.length) {
    question.textContent = messages[noClicks-1];
  } else {
    question.textContent = "Pretty please? 😇";
  }
});

// When Yes is clicked
yesBtn.addEventListener('click', () => {
  question.textContent = "YAY! 💖 You said YES! 💌";
  yesBtn.style.display = 'none';
  noBtn.style.display = 'none';
  startFireworks();
});

// Fireworks animation
let fireworksArr = [];

function startFireworks() {
  setInterval(() => {
    createFirework(Math.random() * canvas.width, Math.random() * canvas.height/2);
  }, 300);

  requestAnimationFrame(animateFireworks);
}

function createFirework(x, y) {
  for (let i=0; i<30; i++) {
    fireworksArr.push({
      x: x,
      y: y,
      dx: (Math.random() - 0.5) * 5,
      dy: (Math.random() - 0.5) * 5,
      alpha: 1,
      color: `hsl(${Math.random()*360}, 100%, 60%)`
    });
  }
}

function animateFireworks() {
  ctx.clearRect(0,0,canvas.width, canvas.height);
  fireworksArr.forEach((f, i) => {
    ctx.fillStyle = f.color;
    ctx.globalAlpha = f.alpha;
    ctx.beginPath();
    ctx.arc(f.x, f.y, 3, 0, Math.PI*2);
    ctx.fill();
    f.x += f.dx;
    f.y += f.dy;
    f.alpha -= 0.02;
    if (f.alpha <= 0) fireworksArr.splice(i, 1);
  });
  requestAnimationFrame(animateFireworks);
}
</script>

</body>
</html>
